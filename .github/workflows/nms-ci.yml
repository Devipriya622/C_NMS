
name: NMS Build, GoogleTest, Valgrind and Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake lcov valgrind

      - name: Build and run GoogleTest
        run: make test

      - name: Run Valgrind memory checks
        run: make valgrind

      - name: Generate code coverage report
        run: make coverage

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: nms-coverage-report
          path: build/coverage_html/
